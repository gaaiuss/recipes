[pytest]
DJANGO_SETTINGS_MODULE = project.settings # path where your django project settings.py is
# test naming conventions: these are used by pytest to locate all test files
# inside your project.
python_files = test.py tests.py test_*.py tests_*.py *_test.py *_tests.py
addopts = # pytest attributes
  --doctest-modules # pytest is now able to execute doctests (tests via docstring)
  # you is now able to classify (mark) a test with custom markers. The strict
  # word, tells pytest to use olny your custom markers.
  --strict-markers
markers = # put your markers here.
  slow: Run slow tests
  fast: Run fast tests